                              "@type": "Question",
                              "name": "What is a custom-cut screen protector?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "It is protective film cut to your device’s exact dimensions at the time of purchase, rather than pre-packaged for one popular model. We load your phone’s profile into an on-site cutting machine, which trims the film to match the screen, curves, buttons, camera and cut-outs before it is applied."

                              "@type": "Question",
                              "name": "Which devices can you protect?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Virtually any smartphone, plus many tablets and smartwatches. Because we cut on demand from a library of over 25,000 device profiles, we are not limited to what is in stock — flat screens and curved screens are both covered."
                              }
                    },

                              "@type": "Question",
                              "name": "How long does it take?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Most visits take under ten minutes. The film itself is cut in roughly two minutes, then our staff clean the display and apply the protector bubble-free."
                              }
                    },

                              "@type": "Question",
                              "name": "What does the display damage warranty cover?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Display warranty claims cover accidental display damage or breakage for 12 months from installation — provided the protection film was fitted on the device at the time of damage — with up to two claims per plan year. A flat ₹2,500 service fee applies to every claim, charged in addition to any cost-share and non-refundable. The first claim is fully covered on a Premium Aftermarket display; an Authorised Original display is split 60% Trevix365 / 40% you on both claims."
                              }
                    },
                    {
                              "@type": "Question",
                              "name": "How does the authorised service option work?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Trevix365 handles the entire claim process for you. Authorised Original display replacements are done at our network of 7 authorised OEM service centres in Kochi, with the cost split 60% Trevix365 / 40% you on both claims in the plan year. If your display is already a Premium Aftermarket one fitted from an earlier claim, the Authorised Original option is not available for later claims on the plan. Typical repair turnaround is 2–3 working days; some repairs are completed in as little as 3–5 hours depending on part availability."
                              }
                    },
                    {
                              "@type": "Question",
                              "name": "What is not covered by a plan?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Plans do not cover internal components (motherboard, camera, battery, speaker, charging port), dents or cosmetic wear, liquid or fire damage, loss, theft or intentional damage, a tampered IMEI, damage caused by an earlier unauthorised repair, software issues, or loss of data and settings."
                              }
                    },
                    {
                              "@type": "Question",
                              "name": "Clear, matte or privacy — what is the difference?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Clear keeps maximum screen clarity, matte reduces glare and fingerprints, and privacy narrows the viewing angle so people beside you cannot read your screen."
                              }
                    },

                              "@type": "Question",
                              "name": "Does the protector work on curved screens?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "Yes. We use a flexible premium TPU that is curved-screen compatible, so it follows the edge of a curved display instead of lifting at the corners the way rigid tempered glass often does."
                              }
                    },
                    {
                              "@type": "Question",
                              "name": "What is 450 micron TPU and why does it matter?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "450 micron (0.45 mm) describes the film’s thickness. A thicker TPU layer absorbs and spreads impact energy rather than transferring it straight to the glass, while staying flexible enough to wrap a curved edge."
                              }
                    },

                              "@type": "Question",
                              "name": "How much does it cost?",

                              }

                              "@type": "Question",

                              }
                    },
                    {
                              "@type": "Question",
                              "name": "Is a screen protector better than tempered glass?",
                              "acceptedAnswer": {
                                        "@type": "Answer",
                                        "text": "A 450 micron TPU protector absorbs impact and flexes rather than shattering, and because it is cut to size it reaches edge-to-edge on curved screens. Tempered glass gives a firmer surface feel but comes in fixed sizes and can crack or lift at the edges."
                              }
                    },

                              "@type": "Question",
